<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2447F5"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icon-192.png"><title>DSA Grind</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;700&display=swap" rel="stylesheet">
<script src="/chart.umd.min.js"></script>
<style>
:root{--bg:#EEF1F6;--sf:#fff;--ink:#151B2B;--mu:#5B6478;--ln:#D6DBE6;--ac:#2447F5;--acs:#E9EDFF;--mk:#FFE45C;--ok:#0E9F6E;--e:#0E9F6E;--m:#D97706;--h:#D6336C;--r:14px;--sh:0 1px 2px rgba(16,24,40,.05),0 14px 30px -22px rgba(16,24,40,.5);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10131C;--sf:#181C28;--ink:#EAEEF8;--mu:#9AA3B8;--ln:#2A3144;--ac:#8EA2FF;--acs:#1E2440;--ok:#34D399;--e:#34D399;--m:#F5B94A;--h:#FF7AA8}}
:root[data-theme="dark"]{--bg:#10131C;--sf:#181C28;--ink:#EAEEF8;--mu:#9AA3B8;--ln:#2A3144;--ac:#8EA2FF;--acs:#1E2440;--ok:#34D399;--e:#34D399;--m:#F5B94A;--h:#FF7AA8}
*{box-sizing:inherit}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
html{scroll-padding-top:70px}
body{overflow-x:hidden}
.app{max-width:760px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom,0px))}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
button:focus-visible,.row:focus-visible,a:focus-visible{outline:2px solid var(--ac);outline-offset:2px}

.top{position:sticky;top:0;z-index:6;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0 10px;margin-bottom:2px;background:var(--bg);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;letter-spacing:-.01em}
.brand img{border-radius:7px}
.streak-chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;color:var(--mu);background:var(--sf);border:1px solid var(--ln);padding:5px 11px;border-radius:999px}
.streak-chip.on{color:var(--ink);border-color:var(--mk);background:linear-gradient(0deg,rgba(255,228,92,.35),rgba(255,228,92,.35)),var(--sf)}

h1{font-size:28px;line-height:1.1;margin:4px 0 0;font-weight:700;letter-spacing:-.02em}
h3{margin:22px 0 8px;font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--mu);font-weight:700}
.sub{margin:6px 0 0;color:var(--mu);font-size:14px;line-height:1.45}
.eyebrow{margin:0;font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ac)}
.chip{font-size:13px;color:var(--mu);margin:0}
.empty{font-size:14px;color:var(--mu);background:var(--sf);border:1px dashed var(--ln);border-radius:var(--r);padding:16px;text-align:center;margin:0}
.hint{font-size:12.5px;line-height:1.55;color:var(--mu);margin:14px 2px 0}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin:6px 0 14px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 12px}
.st{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:11px 12px;box-shadow:var(--sh)}
.st span{display:block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--mu)}
.st b{display:block;font-size:20px;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
.st i{display:block;height:4px;border-radius:99px;background:var(--ln);margin-top:9px;overflow:hidden}
.st i em{display:block;height:100%;border-radius:99px;transition:width .35s ease}

.seg{display:flex;gap:4px;padding:4px;margin-bottom:12px;background:var(--sf);border:1px solid var(--ln);border-radius:12px}
.seg button{flex:1;border:0;background:none;color:var(--mu);font:inherit;font-size:14.5px;font-weight:600;padding:9px 6px;border-radius:9px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--sf);box-shadow:var(--sh)}
.prog .bar{height:6px;background:var(--ln);border-radius:99px;overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--ac);border-radius:99px;transition:width .35s ease}
.tot{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;color:var(--mu);margin:7px 2px 14px}

.ptabs{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 14px;margin:0 -16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.ptabs::-webkit-scrollbar{display:none}
.ptab{flex:none;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--ln);background:var(--sf);color:var(--mu);font:inherit;font-size:13.5px;font-weight:600;padding:8px 12px;border-radius:999px;cursor:pointer;white-space:nowrap;box-shadow:var(--sh)}
.ptab em{font-style:normal;font-size:11px;font-weight:700;color:var(--mu);background:var(--bg);border-radius:999px;padding:2px 7px}
.ptab .ok-dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.ptab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--sf)}
.ptab[aria-selected="true"] em{background:rgba(255,255,255,.16);color:var(--sf)}

.card{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);box-shadow:var(--sh);padding:15px}
.card+.card{margin-top:12px}
.pat-h h2{margin:0;font-size:17px;letter-spacing:-.01em}
.pat-h .sub{margin-top:5px}
.list{margin:14px -15px -15px;border-top:1px solid var(--ln);border-radius:0 0 var(--r) var(--r);overflow:hidden}

.row{display:flex;align-items:center;gap:12px;padding:11px 15px;cursor:pointer;background:var(--sf)}
.row+.row{border-top:1px solid var(--ln)}
.row:hover{background:color-mix(in srgb,var(--ac) 5%,var(--sf))}
.row:active{background:color-mix(in srgb,var(--ac) 9%,var(--sf))}
.row-main{flex:1;min-width:0}
.row-t{display:block;font-size:15.5px;font-weight:600;line-height:1.3}
.row-m{display:block;font-size:12.5px;color:var(--mu);margin-top:3px;line-height:1.4}
.chev{flex:none;color:var(--ln);font-size:20px;font-weight:700;line-height:1}
.tick{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--ln);background:var(--sf);display:grid;place-items:center;color:transparent}
.tick svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.tick[data-s="tracked"]{border-color:var(--ok);color:var(--ok)}
.tick[data-s="saved"]{border-color:var(--ok);background:var(--ok);color:#fff}
.mini{flex:none;font:inherit;font-size:12.5px;font-weight:600;padding:7px 11px;border-radius:999px;border:1px solid var(--ln);background:var(--sf);color:var(--ink);cursor:pointer;white-space:nowrap}
.mini:hover{border-color:var(--ac);color:var(--ac)}

.nudge{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--acs);border:1px solid var(--ac);border-radius:var(--r);padding:12px 14px;margin-bottom:14px;cursor:pointer}
.nudge b{font-size:14.5px}
.nudge small{display:block;color:var(--mu);font-size:12.5px;margin-top:2px;line-height:1.4}
.nudge .chev{color:var(--ac)}

.fld{display:block;margin-top:12px}
.fld span{display:block;font-size:12.5px;font-weight:700;color:var(--mu);margin-bottom:6px}
input,textarea{width:100%;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;background:var(--bg);color:var(--ink);border:1px solid var(--ln);border-radius:10px;padding:10px 11px}
input:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:1px;border-color:var(--ac)}
input[type=number]{font-size:16px;font-weight:700;font-family:inherit}
input[type=password]{letter-spacing:.06em}
textarea{min-height:150px;resize:vertical;display:block}
#nt{min-height:78px}
.btns{display:grid;gap:8px;margin-top:12px}
.btns.two{grid-template-columns:1fr 1fr}
.btn{font:inherit;font-size:14px;font-weight:600;padding:11px 12px;border-radius:11px;border:1px solid var(--ln);background:var(--sf);color:var(--ink);cursor:pointer;text-align:center}
.btn.p{background:var(--ac);border-color:var(--ac);color:#fff}
.btn:active{transform:translateY(1px)}
.btn.good{border-color:var(--ok);color:var(--ok);background:var(--acs)}
.btn:disabled{opacity:.6;cursor:default}
label.btn.imp{display:grid;place-items:center;cursor:pointer}
.warn{color:var(--h);font-size:13.5px;min-height:16px;margin:9px 0 0;line-height:1.4}
.warn:empty{min-height:0}
.ok-msg{color:var(--ok)}
.chk{display:flex;gap:10px;align-items:flex-start;margin-top:12px;font-size:13.5px;line-height:1.45;color:var(--ink);cursor:pointer}
.chk input{width:19px;height:19px;flex:none;margin:1px 0 0;accent-color:var(--ac);cursor:pointer}

#ov{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center}
#ov[hidden]{display:none}
.scrim{position:absolute;inset:0;background:rgba(8,11,20,.45);opacity:0;transition:opacity .25s ease;backdrop-filter:blur(14px) saturate(130%);-webkit-backdrop-filter:blur(14px) saturate(130%)}
.sheet{position:relative;display:flex;flex-direction:column;width:100%;max-width:760px;max-height:min(94vh,880px);background:var(--sf);border-radius:24px 24px 0 0;box-shadow:0 -30px 80px -30px rgba(0,0,0,.6);transform:translateY(102%);transition:transform .3s cubic-bezier(.32,.72,0,1);overflow:hidden}
#ov.open .scrim{opacity:1}
#ov.open .sheet{transform:none}
.handle{width:40px;height:4px;border-radius:99px;background:var(--ln);margin:9px auto 3px;flex:none}
.sh-head{display:flex;align-items:flex-start;gap:12px;padding:6px 16px 13px;border-bottom:1px solid var(--ln);flex:none}
.sh-head .grow{flex:1;min-width:0}
.sh-head h2{margin:4px 0 0;font-size:19px;line-height:1.25;letter-spacing:-.01em}
.icon{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--ln);background:var(--sf);color:var(--mu);font-size:15px;line-height:1;cursor:pointer;display:grid;place-items:center}
.icon:hover{background:var(--bg)}
.sh-body{flex:1;display:grid;grid-template-columns:minmax(0,1fr);gap:14px;padding:14px 16px 10px;overflow:auto;-webkit-overflow-scrolling:touch}
.sh-body h3{margin:16px 0 8px}
.sh-body h3:first-of-type{margin-top:0}
.sh-chips{display:flex;flex-wrap:wrap;gap:8px;order:-2;grid-column:1/-1}
.sh-info{order:0;min-width:0}
.sh-code{order:-1;min-width:0;display:flex;flex-direction:column}
.ed-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.ed-lbl{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--mu)}
#cd{flex:1;min-height:210px;resize:none;border-radius:12px;font-size:13px;line-height:1.55;tab-size:2}
.draft-note{font-size:11.5px;color:var(--mu);margin:8px 0 0}
.save-pill{flex:none;font-size:11px;font-weight:700;color:var(--mu);background:var(--bg);border:1px solid var(--ln);border-radius:999px;padding:4px 9px;white-space:nowrap;opacity:.85;transition:.2s}
.save-pill.on{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,var(--ln));background:color-mix(in srgb,var(--ok) 10%,var(--sf));opacity:1}
.lc-sub{background:var(--bg);border:1px solid var(--ln);border-radius:11px;padding:10px 12px}
.lc-row{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.lc-row b{font-size:15.5px;letter-spacing:-.01em}
.lc-row span{font-size:11.5px;font-weight:700;color:var(--mu);text-align:right}
.lc-diff{margin:7px 0 0;font-size:12.5px;font-weight:700;color:var(--m)}
.sync-bar{height:6px;background:var(--ln);border-radius:99px;overflow:hidden;margin-top:10px}
.sync-bar i{display:block;height:100%;width:0;background:var(--ac);border-radius:99px;transition:width .35s ease}
.cchip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--mu);background:var(--bg);border:1px solid var(--ln);border-radius:999px;padding:6px 12px;text-decoration:none}
a.cchip{color:var(--ac);border-color:var(--acs);background:var(--acs)}
a.cchip:hover{text-decoration:none}
.tm-chip{font-family:ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
details.idea{background:#FFF6C9;background:color-mix(in srgb,var(--mk) 32%,var(--sf));border:1px solid var(--ln);border-radius:12px;padding:11px 13px}
details.idea summary{cursor:pointer;font-weight:700;font-size:14px;list-style:none}
details.idea summary::-webkit-details-marker{display:none}
details.idea summary::before{content:"▸ ";color:var(--mu)}
details.idea[open] summary::before{content:"▾ "}
.trick{margin:9px 0 0;font-size:15px;line-height:1.5;color:var(--ink)}
.trick span{background:linear-gradient(transparent 55%,var(--mk) 55%);padding:0 2px}
#cd{min-height:180px;font-size:12.5px}
.cap-sum{cursor:pointer;font-size:13.5px;font-weight:600;color:var(--ac);list-style:none;padding:4px 0}
.cap-sum::-webkit-details-marker{display:none}
.cap-sum::before{content:"▸ "}
details[open] .cap-sum::before{content:"▾ "}
#pv{background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:11px;font-size:12px;white-space:pre-wrap;overflow:auto;max-height:240px;margin:8px 0 0}
.sh-foot{flex:none;border-top:1px solid var(--ln);background:var(--sf);padding:11px 16px calc(13px + env(safe-area-inset-bottom,0px))}
.sh-foot .cap{display:block;font-size:12.5px;color:var(--mu);font-weight:600;margin-bottom:9px}
.gr4{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.gbtn{font:inherit;font-size:13.5px;font-weight:700;padding:12px 4px;border-radius:11px;border:1px solid var(--ln);background:var(--sf);color:var(--ink);cursor:pointer}
.gbtn:active{transform:translateY(1px)}
.gbtn[data-g="easy"]{color:var(--ok);border-color:var(--ok);background:color-mix(in srgb,var(--ok) 8%,var(--sf))}
.gbtn[data-g="ok"]{color:var(--ac);border-color:var(--ac);background:var(--acs)}
.gbtn[data-g="hard"]{color:var(--m);border-color:var(--m);background:color-mix(in srgb,var(--m) 10%,var(--sf))}
.gbtn[data-g="failed"]{color:var(--h);border-color:var(--h);background:color-mix(in srgb,var(--h) 8%,var(--sf))}

.bnav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
.bnav-in{max-width:880px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px 12px 10px}
.bnav button{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;color:var(--mu);font:inherit;font-size:11px;font-weight:700;letter-spacing:.02em;padding:6px 4px;border-radius:12px;cursor:pointer}
.bnav svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bnav button[aria-selected="true"]{color:var(--ac);background:var(--acs)}

@media (min-width:640px){
 #ov{align-items:center;padding:24px}
 .sheet{border-radius:24px;max-height:86vh;transform:translateY(16px) scale(.98);opacity:0;transition:transform .25s ease,opacity .25s ease}
 #ov.open .sheet{transform:none;opacity:1}
}
@media (min-width:820px){
 .sheet{max-width:940px}
 .sh-body{grid-template-columns:330px minmax(0,1fr);overflow:hidden;align-items:stretch}
 .sh-chips{order:0}
 .sh-info{order:0;overflow:auto;border-right:1px solid var(--ln);padding-right:14px;min-height:0;align-self:stretch}
 .sh-code{order:0;min-height:0}
 #cd{min-height:0}
}
@media (max-width:420px){
 .st b{font-size:18px}
 h1{font-size:26px}
}
/* ===== v3: pomodoro • profile • modal tabs • review badges • calendar ===== */
.bnav-in{grid-template-columns:repeat(5,1fr)}
.top{flex-wrap:nowrap}
.ppill{flex:none;display:flex;align-items:center;gap:4px;margin-left:auto;background:var(--sf);border:1px solid var(--ln);border-radius:999px;padding:4px 5px 4px 10px;box-shadow:var(--sh)}
.ppill .pk{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mu)}
.ppill.f .pk{color:var(--ac)}
.ppill.r .pk{color:var(--ok)}
.ppill b{font-size:13.5px;font-variant-numeric:tabular-nums;min-width:44px;text-align:center}
.pi{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--ln);background:var(--sf);color:var(--ink);font-size:12px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0}
.pi:active{transform:scale(.93)}
.ppill.f .pi:first-of-type{background:var(--ac);border-color:var(--ac);color:#fff}
@media (max-width:390px){.brand{font-size:0}.brand img{width:20px;height:20px}}
.pom{display:flex;gap:12px;align-items:stretch;justify-content:space-between;padding:16px}
.pom-l{display:flex;flex-direction:column;gap:6px;min-width:0}
.pom-t{font-size:36px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1;letter-spacing:-.02em}
.dots{display:flex;gap:4px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--ac)}
.dots i.z{background:var(--ln)}
.pom-r{display:flex;flex-direction:column;gap:8px;flex:none;width:120px}
.pom-r .btn{padding:10px 8px}
.hl{display:flex;align-items:center;gap:7px;margin:18px 0 8px}
.hl em{font-style:normal;font-size:12px;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--sf);border:1px solid var(--ln);color:var(--mu)}
.hl.hb{color:var(--h)}.hl.hb em{color:var(--h);border-color:var(--h)}
.hl.hw{color:var(--m)}.hl.hw em{color:var(--m);border-color:var(--m)}
.hl.hs{color:var(--ac)}.hl.hs em{color:var(--ac);border-color:var(--ac)}
.ok-e{color:var(--ok)}
.rv{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--sf);border:1px solid var(--ln);color:var(--mu);vertical-align:middle;white-space:nowrap}
.rv.bad{color:var(--h);border-color:var(--h);background:color-mix(in srgb,var(--h) 10%,var(--sf))}
.rv.warn{color:var(--m);border-color:var(--m);background:color-mix(in srgb,var(--m) 14%,var(--sf))}
.rv.soon{color:var(--ac);border-color:var(--acs);background:var(--acs)}
.rv.ok{color:var(--ok);border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--sf))}
.rv.mild{color:var(--mu)}
.lock-mini{font-size:11px}
.row.locked .row-t{color:var(--mu)}
.row.locked .tick{opacity:.55}
.tick.demo{display:inline-grid;vertical-align:middle;width:19px;height:19px}
.lockchip{color:var(--m);border-color:var(--m);background:color-mix(in srgb,var(--m) 12%,var(--sf))}
.sh-tabs{display:flex;gap:6px;margin-bottom:12px;position:sticky;top:0;z-index:2;background:var(--sf);padding:2px 0}
.sh-tabs button{flex:1;font:inherit;font-size:13px;font-weight:700;padding:8px 4px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--mu);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.sh-tabs button[aria-selected="true"]{background:var(--acs);border-color:var(--ac);color:var(--ac)}
.sh-tabs em{font-style:normal;font-size:11px;background:var(--sf);border:1px solid var(--ln);border-radius:99px;padding:0 6px}
.sh-tabs button[aria-selected="true"] em{background:var(--ac);border-color:var(--ac);color:#fff}
details.sub{border:1px solid var(--ln);border-radius:12px;margin-bottom:8px;background:var(--sf);overflow:hidden}
details.sub summary{list-style:none;display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer;font-size:12.5px}
details.sub summary::-webkit-details-marker{display:none}
details.sub summary .chev{margin-left:auto;color:var(--mu)}
details.sub.acc{border-color:var(--ok)}

async function save() {

  // Persist to API (writes to dsa-grind-2026-10-27.json)
  try {
    await fetch('/api/data', {
      method: 'PUT',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(ST)
    });
    // Update offline cache after successful write
    try { localStorage.setItem(K, JSON.stringify(ST)); } catch(e) {}
  } catch (e) {
    console.warn('API save failed (offline):', e);
    // Queue for retry when back online
    if (!window._saveQueue) window._saveQueue = [];
    window._saveQueue.push({data: JSON.parse(JSON.stringify(ST)), time: Date.now()});
  }
}

// Retry queued saves when back online
function flushSaveQueue() {
  if (!window._saveQueue || !window._saveQueue.length) return;
  const queue = window._saveQueue;
  window._saveQueue = [];
  queue.forEach(function(item){ save(); });
}

// ============================================
// STRIVERS A2Z DSA SHEET
// Stored in strivers-a2z.json (syncs via /api/codolio)
// Full parity with ladder: Problem modal, code editor, draft autosave,
// spaced repetition scheduling (SM-2), submissions history, LeetCode pull.
// Shared app Pomodoro and Problem stopwatch.
// ============================================
var A2Z = { problems: [], stats: {}, p: {}, dr: {}, d: {}, lc: {}, lsub: {} };
var A2Z_BY_ID = {};
var A2Z_LOADED = false;
var A2Z_CUR = null;
var A2Z_MODE = false;
var A2Z_SEARCH = "";
var A2Z_DIFF_FILTER = "";
var A2Z_STATUS_FILTER = "";
var A2Z_STEP_OPEN = { "1": true };

function a2zStepNum(s) {
  var m = (s || '').match(/Step\s+(\d+)/i);
  return m ? parseInt(m[1], 10) : 999;
}
function a2zLecNum(s) {
  var m = (s || '').match(/Lec\s+(\d+)/i);
  return m ? parseInt(m[1], 10) : 999;
}

function applyA2zData(data) {
  data = data || {};
  A2Z.problems = data.problems || [];
  A2Z.stats = data.stats || {};
  A2Z.p = data.p || {};
  A2Z.dr = data.dr || {};
  A2Z.d = data.d || {};
  A2Z.lc = data.lc || {};
  A2Z.lsub = data.lsub || {};

  A2Z.problems.sort(function(a, b) {
    var sa = a2zStepNum(a.topic), sb = a2zStepNum(b.topic);
    if (sa !== sb) return sa - sb;
    var la = a2zLecNum(a.subTopic), lb = a2zLecNum(b.subTopic);
    if (la !== lb) return la - lb;
    return 0;
  });

  A2Z_BY_ID = {};
  A2Z.problems.forEach(function(p) {
    if (p && p.id) A2Z_BY_ID[p.id] = p;
  });
}

async function codolioFetch(endpoint, method, body) {
  var url = '/api/codolio?endpoint=' + encodeURIComponent(endpoint);
  var opts = { method: method || 'GET', headers: {} };
  if (body) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  var r = await fetch(url, opts);
  if (!r.ok) throw new Error('Codolio API ' + r.status);
  return r.json();
}

async function loadA2zState() {
  if (A2Z_LOADED) return;
  try {
    var cached = localStorage.getItem('dsa_a2z_cache');
    if (cached) {
      var parsed = JSON.parse(cached);
      if (parsed && parsed.problems && parsed.problems.length) {
        applyA2zData(parsed);
      }
    }
  } catch (e) {}

  try {
    var data = await codolioFetch('read', 'GET');
    if (data && data.problems && data.problems.length) {
      applyA2zData(data);
      A2Z_LOADED = true;
      try { localStorage.setItem('dsa_a2z_cache', JSON.stringify(A2Z)); } catch (e) {}
    } else if (!A2Z.problems.length) {
      toast('Fetching A2Z sheet from Codolio (one-time)…');
      await codolioFetch('refresh', 'GET');
      var refreshed = await codolioFetch('read', 'GET');
      applyA2zData(refreshed);
      A2Z_LOADED = true;
      try { localStorage.setItem('dsa_a2z_cache', JSON.stringify(A2Z)); } catch (e) {}
    }
  } catch (e) {
    console.warn('A2Z remote load failed:', e);
    if (A2Z.problems.length) A2Z_LOADED = true;
  }
}

var A2Z_SAVE_T = null;
function saveA2zState() {
  try { localStorage.setItem('dsa_a2z_cache', JSON.stringify(A2Z)); } catch (e) {}
  clearTimeout(A2Z_SAVE_T);
  A2Z_SAVE_T = setTimeout(async function() {
    try {
      await codolioFetch('write', 'POST', A2Z);
    } catch (e) {
      console.warn('A2Z server save failed:', e);
    }
  }, 400);
}

function a2zDay(k) {
  return A2Z.d[k] || (A2Z.d[k] = { n: 0, r: 0, s: 0, ids: [] });
}

function a2zFinish(id, g, code, note, sec) {
  var t = ymd(), dd = a2zDay(t), first = !A2Z.p[id], p = A2Z.p[id] || (A2Z.p[id] = { id: id, h: [], b: 0, first: t });
  p.code = code;
  if (note) p.note = note;
  p.time = (p.time || 0) + sec;
  p.h.push({ at: Date.now(), g: g, s: sec || 0, code: code, k: first ? "n" : "r", src: "a2z" });
  if (first) {
    p.b = g === "easy" ? 1 : 0;
    p.due = plus(INT[p.b]);
    dd.n++;
  } else {
    p.b = g === "easy" ? Math.min(5, p.b + 2) : g === "ok" ? Math.min(5, p.b + 1) : g === "hard" ? p.b : 0;
    p.due = plus(g === "failed" ? 1 : g === "hard" ? 2 : INT[p.b]);
    dd.r++;
  }
  dd.s += sec;
  dd.ids.push({ id: id, k: first ? "n" : "r" });
  day(t).s += sec;
  saveA2zState();
  save();
}

function pullSlug(slug) {
  if (!LC.s || !LC.c) return Promise.reject(new Error("Add your LeetCode cookies in Settings first"));
  return fetch("/api/lc", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ session: LC.s, csrf: LC.c, slug: slug })
  }).then(function(r) { return r.json(); });
}

function subHTML_A2Z(id, q) {
  var s = A2Z.lc[id], p = A2Z.p[id];
  var lcSlug = q.slug || (q.problemUrl && (q.problemUrl.match(/leetcode\.com\/problems\/([^/]+)/) || [])[1]);
  if (!lcSlug) return '<p class="chip">Practice problem on TakeUForward — solve and paste code above.</p>';
  if (!s) return '<p class="chip">LeetCode problem — use “Pull from LeetCode” to load your accepted submission.</p>';
  var h = '<div class="lc-row"><b>' + esc(s.runtime || "—") + '</b><span>' + esc(String(s.lang || "").toUpperCase()) + ' · ' + fmtTs(s.ts) + '</span></div>';
  if (s.code && p && p.code && s.code !== p.code) h += '<p class="lc-diff">LeetCode has a newer version than your saved one.</p>';
  return h;
}

function subRenderA2z(id) {
  var p = A2Z.p[id] || {}, ev = [];
  var CLS = { easy: ["Easy ✓", "b-ok"], ok: ["OK ✓", "b-lc"], hard: ["Hard ✓", "b-warn"], failed: ["Failed", "b-fail"], synced: ["Synced · LC", "b-lc"], local: ["Submitted here", "b-mu"], a2z: ["Submitted · A2Z", "b-mu"] };
  (p.h || []).forEach(function(h) {
    ev.push({ at: h.at || 0, g: h.g, s: h.s || 0, src: h.src || "a2z", code: h.code || "", runtime: "", lang: "" });
  });
  (A2Z.lsub[id] || []).forEach(function(s) {
    ev.push({ at: Number(s.timestamp || 0) * 1000, g: s.statusDisplay || "", s: 0, src: "lch", runtime: s.runtime || "", lang: s.langName || s.lang || "", code: "" });
  });
  ev.sort(function(a, b) { return b.at - a.at; });
  var n = $("subC"); if (n) n.textContent = String(ev.length);
  var el = $("subL"); if (!el) return;
  el.innerHTML = ev.length ? ev.map(function(e) {
    var cls, lbl;
    if (e.src === "lch") {
      cls = e.g === "Accepted" ? "b-ok" : "b-fail";
      lbl = (e.g === "Accepted" ? "Accepted" : "Try " + (e.g || "—")) + " · LC";
    } else {
      var m = CLS[e.g] || ["Done", "b-mu"];
      lbl = m[0]; cls = m[1];
    }
    var mt = [];
    if (e.s) mt.push(mm(e.s));
    if (e.runtime) mt.push(e.runtime);
    if (e.lang) mt.push(e.lang);
    return '<details class="sub' + (e.g === "Accepted" ? " acc" : "") + '"><summary><span class="srcb ' + cls + '">' + esc(lbl) + '</span><span class="sdate">' + fmtTs(e.at) + '</span><span class="smeta">' + esc(mt.join(" · ")) + '</span><i class="chev">' + ICO.chev + '</i></summary>' + (e.code ? '<pre>' + esc(e.code) + '</pre>' : '<p class="chip">Code not stored for this entry.</p>') + '</details>';
  }).join("") : '<p class="empty">No submissions yet — Submit here, or grade to schedule next review.</p>';
}

function openA2z(id) {
  var q = A2Z_BY_ID[id];
  if (!q) { toast('Problem not found'); return; }
  A2Z_MODE = true;
  A2Z_CUR = id;
  CUR = null;
  T0 = Date.now();

  var p = A2Z.p[id];
  var dr = A2Z.dr[id] || {};
  var ov = $("ov");

  var sNum = (q.topic || '').match(/Step\s+\d+/i)?.[0] || 'Step';
  var lNum = (q.subTopic || '').match(/Lec\s+\d+/i)?.[0] || '';
  var statusLbl = p ? (p.due && p.due <= ymd() ? "Due" : "Recall") : "New";
  $("shEy").textContent = sNum + (lNum ? " · " + lNum : "") + " · " + statusLbl + " · " + (q.difficulty || "Medium");
  $("shTitle").textContent = q.title || q.name;

  var targetUrl = q.problemUrl || (q.slug ? 'https://leetcode.com/problems/' + q.slug + '/' : '');
  $("shLink").href = targetUrl || '#';
  $("shLink").textContent = targetUrl.includes('leetcode.com') ? 'Open on LeetCode ↗' : targetUrl.includes('takeuforward.org') ? 'Open on TakeUForward ↗' : 'Open Problem ↗';

  $("idea").innerHTML = q.resource ? ('<a href="' + esc(q.resource) + '" target="_blank" rel="noopener">TakeUForward Article / Video ↗</a>') : '<span>Strivers A2Z problem — solve, paste code and grade below.</span>';
  $("ideaD").open = false;

  $("ptime").textContent = "Time on this problem: " + (p && p.time ? hm(p.time) : "not tracked yet");
  var geo = (p && p.h || []).filter(function(x) { return x.g === "easy" || x.g === "ok" || x.g === "hard" || x.g === "failed"; });
  $("recC").textContent = geo.length ? ("Recall iterations: " + geo.length + " · last " + ({ easy: "easy ✓", ok: "OK ✓", hard: "hard ✓", failed: "failed" }[geo[geo.length - 1].g] || "done") + " on " + new Date(geo[geo.length - 1].at).toLocaleDateString()) : "Recall iterations: 0 — grade below to start tracking";

  var lcSlug = q.slug || (q.problemUrl && (q.problemUrl.match(/leetcode\.com\/problems\/([^/]+)/) || [])[1]) || null;
  $("lcSub").innerHTML = subHTML_A2Z(id, q);

  $("lockChip").hidden = true;
  $("lk").hidden = true;
  $("sb").disabled = false;
  $("sb").textContent = "Submit";
  $("cd").value = dr.code != null ? dr.code : ((p && p.code) || (A2Z.lc[id] && A2Z.lc[id].code) || "");
  $("nt").value = dr.note != null ? dr.note : ((p && p.note) || "");
  $("pv").textContent = p && p.code ? p.code : "(none saved yet)";
  $("cd").disabled = false;
  $("w").textContent = "";
  $("w").className = "warn";

  if (lcSlug) {
    $("pl").disabled = false;
    $("pl").hidden = false;
    $("pl").textContent = "Pull from LeetCode";
  } else {
    $("pl").hidden = true;
  }

  subRenderA2z(id);
  xtShow("det");

  var pill = $("svPill");
  pill.textContent = dr.at ? "Draft saved" : "Auto-save on";
  pill.classList.toggle("on", !!dr.at);
  var dv = $("dv");
  if (dv) dv.textContent = dr.at ? "Draft stored on this device since " + fmtTs(dr.at) : "Auto-saves to this device as you type";

  ov.hidden = false;
  document.body.style.overflow = "hidden";
  requestAnimationFrame(function() { ov.classList.add("open"); });

  clearInterval(TM);
  $("tm").textContent = "00:00";
  var tm = function() {
    var s = Math.round((Date.now() - T0) / 1000);
    $("tm").textContent = ("0" + (s / 60 | 0)).slice(-2) + ":" + ("0" + s % 60).slice(-2);
  };
  tm();
  TM = setInterval(tm, 1000);
  setTimeout(function() { $("sheet").focus(); }, 50);
}

var A2Z_DT = null;
function a2zDrFlush() {
  clearTimeout(A2Z_DT);
  if ($("ov").hidden || !A2Z_CUR) return;
  var c = $("cd").value, n = $("nt").value.trim();
  if (!c.replace(/\s/g, "") && !n) {
    if (A2Z.dr[A2Z_CUR]) { delete A2Z.dr[A2Z_CUR]; saveA2zState(); }
    return;
  }
  A2Z.dr[A2Z_CUR] = { code: c, note: n, at: Date.now() };
  saveA2zState();
  var pill = $("svPill");
  if (pill) { pill.textContent = "Draft saved ✓"; pill.classList.add("on"); }
}
function a2zDrSave() {
  clearTimeout(A2Z_DT);
  A2Z_DT = setTimeout(a2zDrFlush, 400);
}

function a2zRowHTML(p) {
  var prog = A2Z.p[p.id] || {};
  var t = ymd();
  var isSolved = !!(prog.code || (prog.h && prog.h.length));
  var dueBadge = '';
  if (prog.due) {
    var last = prog.h && prog.h[prog.h.length - 1];

        h += '</div>';
        h += '</div>';
      });
      h += '</div>';
      h += '</section>';
